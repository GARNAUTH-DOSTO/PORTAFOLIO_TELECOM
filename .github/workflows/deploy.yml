## PASO 6: Configurar GitHub Actions (el "motor" que construye tu página)

Esto hace que GitHub convierta automáticamente tus archivos Markdown en una página web bonita cada vez que subas algo nuevo.

1. Clic en **Add file** → **Create new file**
2. Nombre: `.github/workflows/deploy.yml`
   > Escribe el nombre completo incluyendo los puntos y las barras. GitHub creará las carpetas `.github` y `workflows` automáticamente.
3. Pega este contenido:

```yaml
name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install mkdocs-material

      - run: mkdocs build --site-dir site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
