site_name: Portafolio Telecomunicaciones
site_description: Laboratorios de Redes - VM, CML y Packet Tracer
site_author: Tu Nombre
site_url: https://GARNAUTH-DOSTO.github.io/PORTAFOLIO_TELECOM/

# Tema Material con personalizaciones
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Fira Code

# Navegación
nav:
  - Inicio: index.md
  - Laboratorios:
    - VLANs: labs/lab1-vlans.md
    - DHCP: labs/lab2-dhcp.md
  - Sobre mí: about.md

# Extensiones
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

# Plugins
plugins:
  - search
